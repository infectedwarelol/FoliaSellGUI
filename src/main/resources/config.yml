#
# Permissions:
#   - sellgui.use | Access to /sellgui (opens the sellgui)
#   - sellgui.reload | Access to /sellgui reload (reloads configuration)
#   - sellgui.debug | Access to /sellgui dump (dumps server information to a paste)
#

options:
  #
  # 0 - None
  # 1 - Hover message (Adds "receipt_text" to the end of the message)
  #
  receipt_type: 1
  sell_titles: true

  #
  # This is the feature where all sell transactions made via
  # the SellGUI Sell Menu are logged to a file.
  #
  transaction_log:
    # Should the Transaction logging feature be enabled?
    enabled: true
    # Date format of transaction logging (http://docs.oracle.com/javase/7/docs/api/java/text/SimpleDateFormat.html)
    date_format: "yyyy/MM/dd HH:mm:ss"

  #
  # Whether prices should be rounded to 2 decimal places, or not.
  # This also formats prices with comma separation. IE: 1800 -> 1,800
  #
  rounded_pricing: false

  #
  # Whether trailing zero decimals should be removed (28.0, 28.00, etc --> 28)
  #
  remove_trailing_zeros: false

  #
  # Should units be abbreviated? E.g.: 1,259 -> 1.25k
  # Requires "rounded_pricing" to be false
  #
  abbreviate_numbers: false

  #
  # Should the plugin check SpigotMC for a newer release on startup?
  #
  update_check: true

  #
  # Sounds that are played during certain events
  #
  sounds:
    enabled: true
    error_notification: true # Whether there should be a console output notifying you that a sound is invalid
    pitch: 1
    volume: 1
    events:
      # If you don't want a certain event to have a sound, just set to an invalid value
      # Both the old constant style (BLOCK_CHEST_OPEN) and the namespaced key style
      # (minecraft:block.chest.open) are accepted.
      open: BLOCK_CHEST_OPEN
      success: ENTITY_VILLAGER_CELEBRATE
      failed: ENTITY_VILLAGER_HURT

  #
  # Action Bar Messages
  #
  action_bar_msgs: true

  #
  # Legacy option kept for configuration compatibility. Item damage values were
  # removed from Minecraft in 1.13, so this no longer has any effect.
  #
  show_item_damage: true

  #
  # How many rows the GUI will have
  # Min: 1 - Max: 6
  #
  rows: 6

  #
  # Shulker box selling.
  #
  # When enabled, placing a shulker box into the Sell GUI sells the box as a
  # single unit: every sellable item stored inside it is valued using the price
  # ShopGUIPlus has configured for that item, the box is consumed, and the player
  # is paid the combined total. The contents are never handed to the player and
  # are never sold as separate loose items.
  #
  shulker:
    # Should shulker boxes be valued by their contents at all?
    # When false, shulker boxes are priced exactly like any other item.
    enabled: true

    # Should the configured shop price of the empty shulker box itself be added
    # to the total? Only applies when the box is fully consumed.
    include_container_price: true

    # How deep nested shulker boxes are followed. 1 means "only the box that was
    # placed in the GUI", 2 means "that box and boxes stored inside it", etc.
    # Nesting is not possible in vanilla, so this only matters for boxes created
    # with commands or custom items.
    max_depth: 3

    # Safety limit on how many item stacks a single sell may inspect. Sales that
    # exceed this limit leave the remaining boxes untouched instead of stalling
    # the server.
    max_scanned_items: 4096

    # What happens to items inside the box that ShopGUIPlus has no sell price for.
    #   KEEP_ITEMS  - the sellable items are paid for and the box is returned to
    #                 the player containing only the unsellable leftovers.
    #   RETURN_BOX  - the box is not sold at all and is returned untouched.
    #   DISCARD     - the box and everything left inside it are consumed.
    unsellable_contents: KEEP_ITEMS

    # How sold shulker boxes appear on the receipt.
    #   SUMMARY  - one line per box, showing the total the box was worth.
    #   DETAILED - one line per item type that was inside the box.
    receipt_mode: SUMMARY

    # Should players be shown an estimated value when they place a shulker box
    # into the Sell GUI?
    show_estimate: true

  #
  # Similar to the SGP Item format: (EXAMPLE)
  # 1:
  #   type: dummy <--- Not required, but may become applicable in future updates I make
  #   item:
  #     material: STONE
  #     quantity: 1
  #     name: "&7Cool name"
  #     lore:
  #       - "&7Lore Line 1"
  #       - "&9Lore line 2"
  #       ...and so on
  #     customModelData: 1
  #   commandsOnClick: (or commandsOnClickConsole)
  #     - "say %PLAYER%"
  #   slot: 1
  #
  decorations: []

messages:
  no_permission: "&cYou do not have permission"
  sellgui_title: "&0Sell GUI"
  reloaded_config: "&c[SellGUI] Reloaded configuration files."
  no_items_sold: "&aShop > &fYou didn't have anything sellable."
  no_items_in_gui: "&aShop > &fYou didn't place any items in the GUI."
  #
  # {list} - returns a list of sold items
  # {earning} - returns the total amount made
  # {amount} - return number of items sold
  #
  items_sold: "&aShop > &fYou sold &a{list}&f for &a{earning}&f."
  receipt_text: "&7(RECEIPT)"
  receipt_title: "&f&nReceipt for sell\n\n"
  #
  # {amount} - return number of item
  # {item} - returns item name
  # {price} - returns the selling price of the item
  #
  receipt_item_layout: "&a{amount} x {item} &ffor &a{price}"
  #
  # {amount} - return number of items sold
  # {earning} - returns the total amount made
  #
  sell_title: "&a&l+{earning}"
  sell_subtitle: "&7You sold &a&n{amount}&7 items in this batch"
  gamemode_not_allowed: "&aShop > &fYou are not allowed to use the Sell GUI in &a{gamemode} mode&f."
  inventory_full: "&aShop > &fYour inventory is currently full, so excess items have been dropped on the ground."
  #
  # {amount} - return number of items sold
  # {earning} - returns the total amount made
  #
  action_bar_items_sold: "&aShop > &fYou sold &a{amount} &fitems in this batch."
  #
  # Shown when a player places a shulker box into the Sell GUI.
  # {item} - the name of the shulker box
  # {price} - the estimated value of the box
  # {amount} - how many items are stored inside it
  #
  shulker_estimate: "&aShop > &fThat &a{item}&f is worth roughly &a{price}&f (&a{amount}&f items inside)."
  #
  # Shown when a shulker box was sold but held items ShopGUIPlus cannot buy.
  #
  shulker_leftovers: "&aShop > &fItems that couldn't be sold were left inside your shulker box."
  #
  # Shown when the economy refused the payout. Items are always returned first.
  #
  transaction_failed: "&cShop > &fYour sale could not be completed, so your items were returned."
  #
  # Shown when ShopGUIPlus has not finished loading the player's data yet.
  #
  shop_not_ready: "&aShop > &fThe shop is still loading, please try again in a moment."
